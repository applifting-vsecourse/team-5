name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trainloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d trainloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high or critical)
        run: pnpm security:audit

      - name: Create env files
        run: pnpm env:check

      - name: Generate Prisma client
        run: pnpm backend prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint backend
        run: pnpm backend lint:check

      - name: Lint frontend
        run: pnpm frontend lint:check

      - name: Type-check frontend
        run: pnpm frontend type-check

      - name: Test backend
        run: pnpm backend test

      - name: Test frontend
        run: pnpm frontend test:ci

      - name: Build backend
        run: pnpm backend build

      - name: Test authentication API
        run: pnpm backend test:auth

      - name: Test account lifecycle in PostgreSQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/trainloop_test
          AUTH_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trainloop_test
        run: |
          pnpm backend migrate
          pnpm backend test:auth:postgres

      - name: Build frontend
        run: pnpm frontend build
