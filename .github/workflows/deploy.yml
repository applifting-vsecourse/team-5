name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
env:
  COURSE_DOMAIN: vsepractical.applifting.dev
  REGISTRY: registry.vsepractical.applifting.dev
# Read by GitHub Actions on push to main. Effect: staging deploy waits for
# backend+frontend unit tests (#87). No secrets in plain text (uses secrets.*).
# User: "zpracuj stories 57,69 a 87 nad soucasnym dev"
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trainloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d trainloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check
      - run: pnpm backend prisma:generate
      - run: pnpm backend test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/trainloop_test
      - run: pnpm frontend test:ci

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm security:audit

  build-and-deploy:
    needs: [security-audit, tests]
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Determine slug
        id: slug
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "$REPO_NAME" = "edu-template" ]; then SLUG="$OWNER"; else SLUG="${REPO_NAME,,}"; fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "url=https://$SLUG.$COURSE_DOMAIN" >> "$GITHUB_OUTPUT"
      - name: Login to registry
        uses: docker/login-action@v4.8.0
        with:
          registry: registry.vsepractical.applifting.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build & push backend
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/backend/Dockerfile.deploy
          push: true
          build-args: |
            CI_COMMIT_SHA=${{ github.sha }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          tags: ${{ env.REGISTRY }}/${{ steps.slug.outputs.slug }}-backend:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/frontend/Dockerfile.deploy
          push: true
          build-args: |
            VITE_API_URL=${{ steps.slug.outputs.url }}/api
            VITE_BETTER_AUTH_URL=${{ steps.slug.outputs.url }}
          tags: ${{ env.REGISTRY }}/${{ steps.slug.outputs.slug }}-frontend:latest
      - name: Trigger Coolify deploy
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
