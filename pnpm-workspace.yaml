packages:
  - apps/*

catalogs:
  default:
    '@types/node': ^20.19.43
    prettier: ^3.9.10
    react-hook-form: ^7.91.0
    typescript: ^6.0.3
    zod: ^4.6.7
  lint:
    '@eslint/compat': ^2.1.1
    '@eslint/js': ^10.0.1
    '@tanstack/eslint-plugin-query': ^5.106.1
    '@tanstack/eslint-plugin-router': ^1.162.0
    '@typescript-eslint/eslint-plugin': ^8.72.1
    '@typescript-eslint/parser': ^8.72.1
    '@vitest/eslint-plugin': ^1.6.16
    eslint: ^10.14.0
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-import: ^2.32.0
    eslint-plugin-jsx-a11y: ^6.10.2
    eslint-plugin-react: ^7.37.5
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-turbo: ^2.9.6
    globals: ^16.5.0
    typescript-eslint: ^8.72.1
  react19:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1

# Security fixes for versions pinned by upstream dependencies; see docs/security-report.md.
overrides:
  'next@<15.5.29': '^15.5.29'
  'sharp@<0.35.5': '^0.35.5'
  'postcss@<8.5.23': '^8.5.23'
  'multer@<2.5.0': '^2.5.0'
