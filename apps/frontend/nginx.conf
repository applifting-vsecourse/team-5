server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20M;

  # Proxy API requests to NestJS backend in the Docker network
  location /api {
    proxy_pass http://backend:4050;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy uploaded files (e.g. dog photos)
  location /uploads {
    proxy_pass http://backend:4050;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The app is a single-page bundle: routing happens in the browser, so any
  # unknown path has to return the shell. Without this, a hard refresh on
  # any route is a 404 — there is no such file on disk.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html names the hashed bundles, so it must never be cached: a stale
  # copy points at asset files that no longer exist after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite fingerprints everything under /assets/, so a given URL's contents can
  # never change. Safe to cache forever.
  location /assets/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }
}
