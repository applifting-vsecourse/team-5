<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .ht { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .hs { font-size: 12px; fill: #cbd5e1; }
      .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .page { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .pub { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
      .dlg { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .nice { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 2 3; }
      .nice-t { font-size: 14px; font-weight: 600; fill: #64748b; }
      .head { fill: #1e293b; }
      .ln { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
      .arr { stroke: #64748b; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="770" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a">TrainLoop — sitemapa (pracovní verze)</text>
  <text x="40" y="62" class="s">Struktura aplikace a návaznost obrazovek · podrobnosti a čísla features v sitemapa.md</text>

  <!-- Public part -->
  <text x="40" y="86" class="lbl">VEŘEJNÁ ČÁST</text>

  <rect x="40" y="95" width="208" height="52" rx="8" class="pub"/>
  <text x="56" y="117" class="t">Úvodní stránka</text>
  <text x="56" y="135" class="s">/</text>

  <rect x="268" y="95" width="208" height="52" rx="8" class="pub"/>
  <text x="284" y="117" class="t">Registrace</text>
  <text x="284" y="135" class="s">/signup</text>

  <rect x="496" y="95" width="208" height="52" rx="8" class="pub"/>
  <text x="512" y="117" class="t">Přihlášení</text>
  <text x="512" y="135" class="s">/login</text>

  <rect x="724" y="95" width="208" height="52" rx="8" class="pub"/>
  <text x="740" y="117" class="t">Obnova hesla</text>
  <text x="740" y="135" class="s">/reset-password</text>

  <rect x="952" y="95" width="208" height="52" rx="8" class="pub"/>
  <text x="968" y="117" class="t">Přijetí pozvánky</text>
  <text x="968" y="135" class="s">/invite/:kod → registrace</text>

  <line x1="248" y1="121" x2="266" y2="121" class="arr" marker-end="url(#arrow)"/>
  <line x1="704" y1="121" x2="722" y2="121" class="arr" marker-end="url(#arrow)"/>

  <!-- Login → Week -->
  <path d="M600,147 V172 H171 V211" class="arr" marker-end="url(#arrow)"/>
  <text x="608" y="166" class="s">po přihlášení</text>

  <text x="200" y="198" class="lbl">APLIKACE PO PŘIHLÁŠENÍ — HLAVNÍ NAVIGACE</text>

  <!-- ===== Column: Týden ===== -->
  <rect x="40" y="215" width="262" height="52" rx="8" class="head"/>
  <text x="56" y="237" class="ht">Týden</text>
  <text x="56" y="256" class="hs">/week · výchozí stránka</text>

  <path d="M52,267 V431" class="ln"/>
  <path d="M52,311 H64 M52,371 H64 M52,431 H64" class="ln"/>

  <rect x="64" y="287" width="238" height="48" rx="8" class="dlg"/>
  <text x="78" y="307" class="t">Naplánovat trénink</text>
  <text x="78" y="325" class="s">dialog · pes, cíl, úkol, den</text>

  <rect x="64" y="347" width="238" height="48" rx="8" class="dlg"/>
  <text x="78" y="367" class="t">Zapsat trénink</text>
  <text x="78" y="385" class="s">dialog · %, poznámka, video</text>

  <text x="70" y="435" class="s">klik na trénink → Detail úkolu</text>

  <!-- ===== Column: Psi ===== -->
  <rect x="326" y="215" width="262" height="52" rx="8" class="head"/>
  <text x="342" y="237" class="ht">Psi</text>
  <text x="342" y="256" class="hs">/dogs · moji i nasdílení</text>

  <path d="M338,267 V371" class="ln"/>
  <path d="M338,311 H350 M338,371 H350" class="ln"/>

  <rect x="350" y="287" width="238" height="48" rx="8" class="page"/>
  <text x="364" y="307" class="t">Nový pes</text>
  <text x="364" y="325" class="s">/dogs/new · jméno, plemeno, disciplíny</text>

  <rect x="350" y="347" width="238" height="48" rx="8" class="page"/>
  <text x="364" y="367" class="t">Detail psa</text>
  <text x="364" y="385" class="s">/dogs/:psId · přehled, týden, archiv</text>

  <path d="M362,395 V611" class="ln"/>
  <path d="M362,431 H374 M362,491 H374 M362,551 H374 M362,611 H374" class="ln"/>

  <rect x="374" y="407" width="214" height="48" rx="8" class="page"/>
  <text x="388" y="427" class="t">Úprava psa a disciplín</text>
  <text x="388" y="445" class="s">…/edit</text>

  <rect x="374" y="467" width="214" height="48" rx="8" class="page"/>
  <text x="388" y="487" class="t">Sdílení s trenéry</text>
  <text x="388" y="505" class="s">…/sharing · pozvat, kód, odebrat</text>

  <rect x="374" y="527" width="214" height="48" rx="8" class="page"/>
  <text x="388" y="547" class="t">Nový cíl</text>
  <text x="388" y="565" class="s">…/goals/new</text>

  <rect x="374" y="587" width="214" height="48" rx="8" class="page"/>
  <text x="388" y="607" class="t">Detail cíle — plán</text>
  <text x="388" y="625" class="s">zpět · přeskočit · větvit</text>

  <path d="M386,635 V671 H398" class="ln"/>

  <rect x="398" y="647" width="190" height="48" rx="8" class="page"/>
  <text x="412" y="667" class="t">Detail úkolu</text>
  <text x="412" y="685" class="s">historie · komentáře</text>

  <!-- ===== Column: Klienti ===== -->
  <rect x="612" y="215" width="262" height="52" rx="8" class="head"/>
  <text x="628" y="237" class="ht">Klienti</text>
  <text x="628" y="256" class="hs">/clients · jen trenér</text>

  <path d="M624,267 V491" class="ln"/>
  <path d="M624,311 H636 M624,371 H636 M624,431 H636 M624,491 H636" class="ln"/>

  <rect x="636" y="287" width="238" height="48" rx="8" class="page"/>
  <text x="650" y="307" class="t">Čeká na reakci</text>
  <text x="650" y="325" class="s">/clients/inbox → Detail úkolu</text>

  <rect x="636" y="347" width="238" height="48" rx="8" class="page"/>
  <text x="650" y="367" class="t">Detail psa klienta</text>
  <text x="650" y="385" class="s">stejná obrazovka jako v Psi</text>

  <rect x="636" y="407" width="238" height="48" rx="8" class="dlg"/>
  <text x="650" y="427" class="t">Připojit psa kódem</text>
  <text x="650" y="445" class="s">dialog</text>

  <rect x="636" y="467" width="238" height="48" rx="8" class="nice"/>
  <text x="650" y="487" class="nice-t">Pozvat klienta</text>
  <text x="650" y="505" class="s">nice to have</text>

  <!-- ===== Column: Účet ===== -->
  <rect x="898" y="215" width="262" height="52" rx="8" class="head"/>
  <text x="914" y="237" class="ht">Účet</text>
  <text x="914" y="256" class="hs">/account</text>

  <path d="M910,267 V491" class="ln"/>
  <path d="M910,311 H922 M910,371 H922 M910,431 H922 M910,491 H922" class="ln"/>

  <rect x="922" y="287" width="238" height="48" rx="8" class="page"/>
  <text x="936" y="307" class="t">Jméno, e-mail, heslo</text>
  <text x="936" y="325" class="s">úprava údajů</text>

  <rect x="922" y="347" width="238" height="48" rx="8" class="page"/>
  <text x="936" y="367" class="t">Smazání účtu</text>
  <text x="936" y="385" class="s">včetně dat (GDPR)</text>

  <rect x="922" y="407" width="238" height="48" rx="8" class="nice"/>
  <text x="936" y="427" class="nice-t">Notifikace</text>
  <text x="936" y="445" class="s">nice to have</text>

  <rect x="922" y="467" width="238" height="48" rx="8" class="nice"/>
  <text x="936" y="487" class="nice-t">Profil trenéra</text>
  <text x="936" y="505" class="s">nice to have</text>

  <!-- Legend -->
  <line x1="40" y1="718" x2="1160" y2="718" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="736" width="28" height="16" rx="4" class="page"/>
  <text x="76" y="749" class="s">stránka</text>
  <rect x="150" y="736" width="28" height="16" rx="4" class="dlg"/>
  <text x="186" y="749" class="s">dialog nad stránkou</text>
  <rect x="330" y="736" width="28" height="16" rx="4" class="nice"/>
  <text x="366" y="749" class="s">nice to have</text>
  <rect x="540" y="736" width="28" height="16" rx="4" class="head"/>
  <text x="576" y="749" class="s">položka hlavní navigace</text>
  <line x1="750" y1="744" x2="780" y2="744" class="arr" marker-end="url(#arrow)"/>
  <text x="788" y="749" class="s">přechod</text>
</svg>
