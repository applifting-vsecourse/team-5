<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .ht { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .hs { font-size: 12px; fill: #cbd5e1; }
      .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .page { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .pub { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
      .miss { fill: #ffffff; stroke: #ef4444; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .upd { fill: #ffffff; stroke: #3b82f6; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .key { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.6; }
      .head { fill: #1e293b; }
      .ln { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
      .arr { stroke: #64748b; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1040" height="740" fill="#ffffff"/>

  <text x="40" y="34" font-size="20" font-weight="700" fill="#0f172a">TrainLoop — sitemapa</text>
  <text x="40" y="54" class="s">Stav wireframu ve Figmě k 9. 10. a úpravy podle rozhovoru, FB1 a varianty B · popis v sitemapa.md</text>

  <!-- Veřejná část -->
  <text x="40" y="84" class="lbl">VEŘEJNÁ ČÁST</text>
  <rect x="40" y="94" width="160" height="48" rx="8" class="pub"/>
  <text x="56" y="123" class="t">Úvodní stránka</text>
  <rect x="240" y="94" width="160" height="48" rx="8" class="pub"/>
  <text x="256" y="115" class="t">Mám pozvánku</text>
  <text x="256" y="132" class="s">kód od trenéra</text>
  <rect x="440" y="94" width="160" height="48" rx="8" class="pub"/>
  <text x="456" y="115" class="t">Registrace</text>
  <text x="456" y="132" class="s">psovod i trenér</text>
  <rect x="660" y="94" width="160" height="48" rx="8" class="pub"/>
  <text x="676" y="123" class="t">Přihlášení</text>
  <rect x="860" y="94" width="140" height="48" rx="8" class="pub"/>
  <text x="876" y="123" class="t">Obnova hesla</text>

  <line x1="200" y1="118" x2="238" y2="118" class="arr" marker-end="url(#arrow)"/>
  <line x1="400" y1="118" x2="438" y2="118" class="arr" marker-end="url(#arrow)"/>
  <line x1="820" y1="118" x2="858" y2="118" class="arr" marker-end="url(#arrow)"/>

  <path d="M740,142 V166 H150 V188" class="arr" marker-end="url(#arrow)"/>
  <text x="748" y="162" class="s">po přihlášení</text>

  <!-- Hlavní navigace -->
  <text x="290" y="184" class="lbl">HLAVNÍ NAVIGACE</text>
  <rect x="40" y="190" width="220" height="52" rx="8" class="head"/>
  <text x="56" y="213" class="ht">Psi</text>
  <text x="56" y="231" class="hs">seznam psů, barva psa</text>
  <rect x="290" y="190" width="220" height="52" rx="8" class="head"/>
  <text x="306" y="213" class="ht">Týden</text>
  <text x="306" y="231" class="hs">kalendář tréninků</text>
  <rect x="540" y="190" width="220" height="52" rx="8" class="head"/>
  <text x="556" y="213" class="ht">Klienti</text>
  <text x="556" y="231" class="hs">jen trenér</text>
  <rect x="790" y="190" width="210" height="52" rx="8" class="head"/>
  <text x="806" y="213" class="ht">Profil</text>
  <text x="806" y="231" class="hs">kód od trenéra, heslo, účet</text>

  <!-- Psi -->
  <path d="M50,292 H60" class="ln"/>
  <path d="M50,242 V535 H308" class="arr" marker-end="url(#arrow)"/>
  <rect x="60" y="270" width="200" height="44" rx="8" class="miss"/>
  <text x="76" y="297" class="t">Nový pes</text>

  <!-- Týden -->
  <path d="M300,242 V432 M300,292 H310 M300,432 H310" class="ln"/>
  <rect x="310" y="270" width="200" height="44" rx="8" class="upd"/>
  <text x="326" y="290" class="t">Trénink</text>
  <text x="326" y="306" class="s">cvik · instrukce · kritérium</text>
  <rect x="310" y="340" width="200" height="44" rx="8" class="upd"/>
  <text x="326" y="360" class="t">Konec tréninku</text>
  <text x="326" y="376" class="s">% · hodnocení · odkaz na video</text>
  <rect x="310" y="410" width="200" height="44" rx="8" class="miss"/>
  <text x="326" y="430" class="t">Přesunout / Přeskočit</text>
  <text x="326" y="446" class="s">dialog u tréninku (Runna)</text>
  <line x1="410" y1="314" x2="410" y2="338" class="arr" marker-end="url(#arrow)"/>

  <!-- Klienti -->
  <path d="M550,242 V362 M550,292 H560 M550,362 H560" class="ln"/>
  <rect x="560" y="270" width="200" height="44" rx="8" class="page"/>
  <text x="576" y="297" class="t">Pozvat klienta</text>
  <rect x="560" y="340" width="200" height="44" rx="8" class="upd"/>
  <text x="576" y="360" class="t">Detail klienta</text>
  <text x="576" y="376" class="s">psi · záznamy k reakci</text>

  <rect x="800" y="340" width="200" height="44" rx="8" class="miss"/>
  <text x="816" y="360" class="t">Záznam tréninku</text>
  <text x="816" y="376" class="s">video · % · vlákno</text>
  <line x1="760" y1="362" x2="798" y2="362" class="arr" marker-end="url(#arrow)"/>

  <!-- Pes a zadání tréninku -->
  <path d="M600,384 V535 H512" class="arr" marker-end="url(#arrow)"/>
  <text x="520" y="528" class="s">pes klienta</text>
  <rect x="310" y="510" width="200" height="50" rx="8" class="key"/>
  <text x="326" y="531" class="t">Pes (detail)</text>
  <text x="326" y="548" class="s">aktivity · + nový trénink</text>

  <line x1="410" y1="560" x2="410" y2="598" class="arr" marker-end="url(#arrow)"/>
  <path d="M310,552 H285 V625 H262" class="arr" marker-end="url(#arrow)"/>
  <rect x="60" y="600" width="200" height="50" rx="8" class="miss"/>
  <text x="76" y="621" class="t">Poznámky</text>
  <text x="76" y="638" class="s">z lekcí a seminářů · jen psovod</text>
  <rect x="310" y="600" width="200" height="50" rx="8" class="upd"/>
  <text x="326" y="621" class="t">Tvorba tréninku</text>
  <text x="326" y="638" class="s">cíl · cviky · větvení</text>

  <line x1="510" y1="625" x2="558" y2="625" class="arr" marker-end="url(#arrow)"/>
  <rect x="560" y="600" width="240" height="50" rx="8" class="miss"/>
  <text x="576" y="621" class="t">Naplánovat trénink</text>
  <text x="576" y="638" class="s">dny v týdnu → Týden klienta</text>

  <!-- Legenda -->
  <rect x="40" y="704" width="22" height="14" rx="3" class="pub"/>
  <text x="70" y="716" class="s">veřejná stránka</text>
  <rect x="175" y="704" width="22" height="14" rx="3" class="head"/>
  <text x="205" y="716" class="s">hlavní navigace</text>
  <rect x="310" y="704" width="22" height="14" rx="3" class="page"/>
  <text x="340" y="716" class="s">ve wireframu</text>
  <rect x="435" y="704" width="22" height="14" rx="3" class="upd"/>
  <text x="465" y="716" class="s">ve wireframu, upravit</text>
  <rect x="610" y="704" width="22" height="14" rx="3" class="miss"/>
  <text x="640" y="716" class="s">ve wireframu chybí</text>
  <rect x="775" y="704" width="22" height="14" rx="3" class="key"/>
  <text x="805" y="716" class="s">vede na ni víc cest</text>
</svg>
